<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Readmode 设置</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="settings-page">
    <header class="settings-header">
      <div class="brand"><img class="mark" src="../icons/icon.svg" alt="" aria-hidden="true"><div><h1>Readmode 设置</h1><p>本地优先的 Markdown / HTML 阅读与预览工具</p></div></div>
      <span id="version" class="version">v—</span>
    </header>

    <section class="settings-card">
      <h2>阅读体验</h2>
      <label class="setting-row"><span><strong>自动渲染文档链接</strong><small>仅自动处理 Markdown 或明确显示 HTML 源码的页面；也可在插件菜单中为单个网址覆盖规则。</small></span><input id="auto-render" type="checkbox"></label>
      <label class="setting-row"><span><strong>Markdown 默认主题</strong><small>仅影响 Markdown 阅读页，不会改变原始 HTML 页面。</small></span><select id="theme"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label>
      <label class="setting-row"><span><strong>正文宽度</strong><small>目录始终位于左侧，正文会使用右侧剩余空间。</small></span><select id="reader-width"><option value="wide">宽屏</option><option value="comfortable">舒适</option><option value="full">最大化</option></select></label>
      <button id="save-settings" class="primary">保存设置</button><span id="settings-status" class="status" role="status"></span>
    </section>

    <!-- STORE_PRO_SECTION -->
    <section class="settings-card links-card"><h2>帮助与发布信息</h2><div class="link-grid"><a data-site-link="home" href="#">产品主页</a><a data-site-link="privacy" href="#">隐私政策</a><a data-site-link="terms" href="#">使用与销售条款</a><a data-site-link="faq" href="#">常见问题</a><a data-site-link="support" href="#">帮助与反馈</a></div></section>
    <footer>Readmode · 所有文档默认在浏览器本地处理</footer>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
