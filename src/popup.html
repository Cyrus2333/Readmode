<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>Readmode</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <div class="popup">
    <div class="popup-title"><img class="mark" src="../icons/icon.svg" alt="" aria-hidden="true"><div class="popup-brand"><strong>Readmode</strong><small id="context-label">Markdown & HTML Reader</small></div><button id="settings" class="title-action" type="button">设置</button></div>
    <div id="native-view" class="view-section">
      <button id="current" class="primary">在 Readmode 中预览当前文档</button>
      <p class="manual-hint">只会在你点击后读取当前标签页。</p>
    </div>
    <div id="viewer-view" class="view-section hidden">
      <div class="state"><span class="state-dot"></span><span id="viewer-state">当前页面已由 Readmode 渲染</span></div>
      <div id="viewer-actions" class="actions"></div>
    </div>
    <label class="dropzone" for="file-input"><span>打开本地文件</span><small>支持 .md、.markdown、.html</small></label>
    <input id="file-input" type="file" accept=".md,.markdown,.mkd,.mdx,.html,.htm,text/markdown,text/plain,text/html">
    <div class="popup-footer"><span id="status" class="status"></span></div>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
