<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Launch dashboard</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #111827; color: #f9fafb; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 20% 0%, #334155, #111827 46%); }
    main { width: min(880px, calc(100% - 96px)); padding: 56px; border: 1px solid #475569; border-radius: 28px; background: rgba(15, 23, 42, .86); box-shadow: 0 24px 80px rgba(0,0,0,.35); }
    .eyebrow { color: #93c5fd; letter-spacing: .18em; text-transform: uppercase; font-size: 12px; font-weight: 700; }
    h1 { margin: 18px 0 12px; font-size: 56px; letter-spacing: -.05em; }
    p { color: #cbd5e1; font-size: 18px; line-height: 1.6; max-width: 620px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 40px; }
    .card { padding: 20px; border-radius: 18px; background: #1e293b; border: 1px solid #334155; }
    .number { color: #bfdbfe; font-size: 28px; font-weight: 800; }
    .label { color: #94a3b8; margin-top: 6px; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Prototype / Q3 launch</div>
    <h1>Make the next release feel inevitable.</h1>
    <p>A sanitized HTML prototype for demonstrating style-preserving preview. No real brand, customer, or private data is included.</p>
    <div class="grid">
      <div class="card"><div class="number">24</div><div class="label">Decisions shipped</div></div>
      <div class="card"><div class="number">8.4k</div><div class="label">Readers reached</div></div>
      <div class="card"><div class="number">96%</div><div class="label">Confidence score</div></div>
    </div>
  </main>
</body>
</html>
